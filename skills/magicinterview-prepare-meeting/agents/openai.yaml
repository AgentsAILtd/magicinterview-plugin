interface:
  display_name: "MagicInterview Live Copilot"
  short_description: "Set up live help for interviews and meetings"
  default_prompt: "Use $magicinterview-prepare-meeting to set up MagicInterview for my next interview or meeting and give me the direct link to live suggestions."

dependencies:
  tools:
    - type: "mcp"
      value: "magicinterview"
      description: "Manage MagicInterview projects, conversations, context, coaching, direct links, and debug logs."
      transport: "streamable_http"
      url: "https://magicinterview.ai/mcp"

policy:
  allow_implicit_invocation: true
